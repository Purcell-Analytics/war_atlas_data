name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checker unit tests (fails if fewer than 23 ran)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          ran=$(grep -Eo '^Ran [0-9]+ tests' test.log | grep -Eo '[0-9]+')
          echo "tests ran: $ran"
          test "$ran" -ge 23
      - name: Schema and integrity check on the real files
        run: python scripts/check_dataset.py

  quickstart:
    runs-on: ubuntu-latest
    needs: integrity
    env:
      WAR_ATLAS_BASE: ./
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python quickstart (pandas)
        run: |
          pip install pandas
          python examples/quickstart.py
      - name: JavaScript quickstart (Node, no dependencies)
        run: node examples/quickstart.mjs
